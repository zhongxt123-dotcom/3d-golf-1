<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国高尔夫地图</title>
  <link rel="stylesheet" href="./style.css?v=mobile-course-map-fix-20260520">
</head>
<body>
  <div id="title">中国高尔夫球场地图</div>
  <div id="app-toolbar">
    <button id="profile-reset" type="button">重选球风</button>
    <button id="locate-nearby" type="button">附近球场</button>
    <button id="overview-open" type="button">中国球场全览</button>
  </div>
  <div id="hint">拖拽浏览 &nbsp;|&nbsp; 滚轮缩放 &nbsp;|&nbsp; 点击光点查看详情</div>
  <div id="transition-mask">
    <div id="transition-copy">正在进入球场</div>
  </div>

  <!-- ─── 用户档案初始化弹窗 ──────────────────────── -->
  <div id="profile-modal">
    <div id="profile-panel">
      <div id="profile-header">
        <div id="profile-icon">&#9918;</div>
        <h2>专属高尔夫档案</h2>
        <p>请选择您的偏好，为您生成专属数字球童</p>
      </div>

      <div id="profile-questions">
        <div class="pq-group">
          <div class="pq-label">打球策略</div>
          <div class="pq-options">
            <label class="pq-opt"><input type="radio" name="strategy" value="进取型/重炮手"><span>进取型/重炮手</span></label>
            <label class="pq-opt"><input type="radio" name="strategy" value="稳健型/控球派"><span>稳健型/控球派</span></label>
          </div>
        </div>

        <div class="pq-group">
          <div class="pq-label">地形偏好</div>
          <div class="pq-options">
            <label class="pq-opt"><input type="radio" name="terrain" value="沙坑挑战者"><span>沙坑挑战者</span></label>
            <label class="pq-opt"><input type="radio" name="terrain" value="水障恐慌者"><span>水障恐慌者</span></label>
            <label class="pq-opt"><input type="radio" name="terrain" value="山地球场爱好者"><span>山地球场爱好者</span></label>
          </div>
        </div>

        <div class="pq-group">
          <div class="pq-label">体能状况</div>
          <div class="pq-options">
            <label class="pq-opt"><input type="radio" name="environment" value="怕热星人"><span>怕热星人</span></label>
            <label class="pq-opt"><input type="radio" name="environment" value="抗风能力弱"><span>抗风能力弱</span></label>
            <label class="pq-opt"><input type="radio" name="environment" value="体能充沛"><span>体能充沛</span></label>
          </div>
        </div>

        <div class="pq-group">
          <div class="pq-label">当前水平</div>
          <div class="pq-options">
            <label class="pq-opt"><input type="radio" name="skill" value="新手上路"><span>新手上路</span></label>
            <label class="pq-opt"><input type="radio" name="skill" value="业余高手"><span>业余高手</span></label>
            <label class="pq-opt"><input type="radio" name="skill" value="职业水准"><span>职业水准</span></label>
          </div>
        </div>

        <div class="pq-extra-grid">
          <label>
            <span>平均杆数</span>
            <select id="profile-score">
              <option value="未填写">暂不填写</option>
              <option value="100杆以上">100杆以上</option>
              <option value="90-100杆">90-100杆</option>
              <option value="80-90杆">80-90杆</option>
              <option value="80杆以内">80杆以内</option>
            </select>
          </label>
          <label>
            <span>开球距离</span>
            <select id="profile-drive">
              <option value="未填写">暂不填写</option>
              <option value="180码以内">180码以内</option>
              <option value="180-220码">180-220码</option>
              <option value="220-260码">220-260码</option>
              <option value="260码以上">260码以上</option>
            </select>
          </label>
          <label>
            <span>常见失误</span>
            <select id="profile-miss">
              <option value="未填写">暂不填写</option>
              <option value="右曲/右推">右曲/右推</option>
              <option value="左曲/左拉">左曲/左拉</option>
              <option value="距离不稳定">距离不稳定</option>
              <option value="短杆薄弱">短杆薄弱</option>
              <option value="推杆不稳定">推杆不稳定</option>
            </select>
          </label>
          <label>
            <span>本次目标</span>
            <input id="profile-goal" type="text" maxlength="40" placeholder="例如：稳稳破百、少丢球、练短杆">
          </label>
        </div>
      </div>

      <button id="profile-submit" disabled>生成专属数字球童</button>
      <p id="profile-hint">✨ 球童生成后，系统将为您进行全域扫描。地图上亮起的霓虹光点，即为您匹配度达 65% 及以上的推荐球场。</p>
    </div>
  </div>

  <aside id="list-panel" aria-hidden="true">
    <div id="list-header">
      <div>
        <h2 id="list-title">中国球场全览</h2>
        <p id="list-subtitle"></p>
      </div>
      <button id="list-close" type="button">&times;</button>
    </div>
    <div id="list-content"></div>
  </aside>

  <!-- ─── 加载进度条 ──────────────────────────────── -->
  <div id="loading-screen">
    <div id="loading-content">
      <div id="loading-icon">⛳️</div>
      <div id="loading-ring"></div>
      <p id="loading-text">模型加载中...</p>
      <p id="loading-percent">0%</p>
    </div>
  </div>

  <section id="map-detail-layer" aria-hidden="true">
    <canvas id="detail-map-canvas"></canvas>
    <div id="map-detail-head">
      <div>
        <h2 id="map-detail-title">中国高尔夫局部地图</h2>
        <p id="map-detail-meta">Ctrl + 拖动平移，滚轮缩放，底图按地图瓦片高清刷新</p>
      </div>
      <div id="map-detail-actions">
        <button id="map-detail-reset" type="button">复位</button>
        <button id="map-detail-close" type="button">返回地球</button>
      </div>
    </div>
    <div id="map-provider-tools" aria-label="地图底图切换">
      <button class="active" type="button" data-map-provider="amapSatellite">高德卫星</button>
      <button type="button" data-map-provider="amapRoad">高德路网</button>
      <button type="button" data-map-provider="osm">标准地图</button>
    </div>
    <div id="map-detail-scale">高精度刷新</div>
  </section>

  <div id="overlay">
    <div id="model-panel">
      <div id="model-tools">
        <button id="model-terrain-toggle" class="active" type="button">实景地形</button>
        <button id="model-generic-toggle" type="button">3D模型</button>
        <button id="model-amap-toggle" type="button">高德3D</button>
        <button id="model-rotate-toggle" type="button">自动环绕：开</button>
        <label id="model-speed-control">
          <span>旋转速度</span>
          <input id="model-rotate-speed" type="range" min="0" max="1.2" step="0.05" value="0.35">
        </label>
      </div>
      <canvas id="model-canvas"></canvas>
      <div id="external-map-viewer" aria-hidden="true">
        <div id="amap-course-map"></div>
        <div id="external-map-status">正在准备实景三维地图</div>
      </div>
      <div id="photo-detail" aria-hidden="true">
        <img id="photo-detail-image" alt="球场实景细节" />
        <video id="photo-detail-video" playsinline muted loop controls preload="metadata"></video>
        <div id="photo-detail-caption">
          <strong id="photo-detail-title"></strong>
          <span id="photo-detail-meta"></span>
        </div>
        <button id="photo-detail-close" type="button">返回 3D</button>
      </div>
      <div id="model-label"></div>
    </div>

    <div id="card">
      <button id="card-close">&times;</button>

      <div id="sb-info">
        <h2 id="card-title"></h2>
        <p id="card-desc"></p>
        <div id="course-info-grid">
          <div>
            <span>地形图</span>
            <strong id="course-terrain"></strong>
          </div>
          <div>
            <span>周围环境</span>
            <strong id="course-environment"></strong>
          </div>
          <div>
            <span>球场信息</span>
            <strong id="course-summary"></strong>
          </div>
        </div>
        <div id="course-tabs" role="tablist" aria-label="球场资料">
          <button class="course-tab active" type="button" data-course-tab="terrain">地形图</button>
          <button class="course-tab" type="button" data-course-tab="environment">周围环境</button>
          <button class="course-tab" type="button" data-course-tab="info">球场信息</button>
          <button class="course-tab" type="button" data-course-tab="realview">实景地图</button>
        </div>
        <div id="course-tab-panel" aria-live="polite"></div>
      </div>

      <div class="divider"></div>

      <div id="sb-caddy">
        <div id="caddy-avatar">
          <div id="caddy-ring"></div>
          <img src="./assets/caddy_photo.png" alt="数字球童" />
        </div>
        <div id="caddy-bubble">
          <div id="bubble-accent"></div>
          <p id="caddy-text"></p>
        </div>
      </div>
      <div id="caddy-controls">
        <div id="caddy-modes">
          <button class="caddy-mode active" type="button" data-caddy-mode="strategy">球场攻略</button>
          <button class="caddy-mode" type="button" data-caddy-mode="club">选杆建议</button>
          <button class="caddy-mode" type="button" data-caddy-mode="training">训练计划</button>
          <button class="caddy-mode" type="button" data-caddy-mode="routine">赛前清单</button>
        </div>
        <textarea id="caddy-note" maxlength="120" placeholder="补充当天风向、身体状态、距离、常见失误等"></textarea>
        <button id="caddy-ask" type="button">让球童重新分析</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script>
    window.GOLF_MAP_CONFIG = {
      mapTileProvider: "amapSatellite",
      amapKey: "",
      amapSecurityJsCode: ""
    };
  </script>
  <script type="module" src="./main.js?v=mobile-course-map-fix-20260520"></script>
</body>
</html>
